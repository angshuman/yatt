<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YATT — Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --panel:     #1e293b;
      --panel-2:   #162032;
      --border:    #334155;
      --border-hi: #3b82f6;
      --text:      #e2e8f0;
      --text-muted:#94a3b8;
      --accent:    #3b82f6;
      --accent-hi: #60a5fa;
      --red:       #ef4444;
      --green:     #22c55e;
      --toolbar-h: 48px;
      --status-h:  32px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* ─── Layout ──────────────────────────────────────────────── */

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ─── Toolbar ─────────────────────────────────────────────── */

    #toolbar {
      flex: 0 0 var(--toolbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      z-index: 10;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent-hi);
      user-select: none;
      flex-shrink: 0;
    }

    .logo span {
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0;
      font-size: 13px;
      margin-left: 8px;
    }

    .toolbar-center {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    #examples-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
      max-width: 220px;
    }

    #examples-select:hover, #examples-select:focus {
      border-color: var(--accent);
    }

    #examples-select option {
      background: var(--panel);
    }

    .toolbar-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .view-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .view-toggle button {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .view-toggle button:not(:last-child) {
      border-right: 1px solid var(--border);
    }

    .view-toggle button:hover {
      background: var(--panel);
      color: var(--text);
    }

    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ─── Workspace ───────────────────────────────────────────── */

    #workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      height: calc(100vh - var(--toolbar-h) - var(--status-h));
    }

    #editor-pane {
      flex: 0 0 50%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    /* ── Editor overlay container ─────────────────────────────── */

    #editor-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    /* Shared metrics — must be pixel-identical between the two layers */
    #editor-highlight,
    #editor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: 0;
      border: none;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 20px;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
      box-sizing: border-box;
    }

    /* Highlight layer — sits behind the textarea, never receives input */
    #editor-highlight {
      overflow-y: scroll;     /* match scrollbar space so content width = textarea */
      scrollbar-width: none;  /* but hide the scrollbar itself */
      color: transparent;     /* token <span>s supply the color */
      background: transparent;
      pointer-events: none;
      z-index: 1;
    }

    #editor-highlight::-webkit-scrollbar { display: none; }

    /* Textarea — transparent text so the highlight layer shows through */
    #editor {
      background: transparent;
      color: transparent;
      caret-color: var(--text);
      outline: none;
      resize: none;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      z-index: 2;
    }

    #editor::-webkit-scrollbar { width: 6px; }
    #editor::-webkit-scrollbar-track { background: transparent; }
    #editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ─── Divider ─────────────────────────────────────────────── */

    #divider {
      flex: 0 0 4px;
      background: var(--border);
      cursor: col-resize;
      transition: background 0.15s;
      position: relative;
      z-index: 5;
    }

    #divider:hover, #divider.dragging {
      background: var(--accent);
    }

    /* ─── Preview ─────────────────────────────────────────────── */

    #preview-pane {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--panel-2);
      min-width: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #preview-pane::-webkit-scrollbar { width: 6px; }
    #preview-pane::-webkit-scrollbar-track { background: transparent; }
    #preview-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #preview {
      padding: 28px 32px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* ─── Markdown Prose ──────────────────────────────────────── */

    #preview h1,
    #preview h2,
    #preview h3,
    #preview h4 {
      color: var(--text);
      font-weight: 600;
      line-height: 1.3;
      margin-top: 1.6em;
      margin-bottom: 0.5em;
    }

    #preview h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 0; }
    #preview h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
    #preview h3 { font-size: 1.15em; }
    #preview h4 { font-size: 1em; }

    #preview p {
      color: var(--text);
      line-height: 1.75;
      margin-bottom: 1em;
    }

    #preview ul, #preview ol {
      margin: 0.5em 0 1em 1.5em;
      line-height: 1.75;
    }

    #preview li { margin-bottom: 0.25em; }

    #preview a { color: var(--accent-hi); text-decoration: underline; text-underline-offset: 2px; }
    #preview a:hover { color: #93c5fd; }

    #preview strong { color: #f1f5f9; font-weight: 600; }
    #preview em { color: #cbd5e1; font-style: italic; }

    #preview blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 1em 0;
      background: rgba(59,130,246,0.06);
      border-radius: 0 4px 4px 0;
      color: var(--text-muted);
    }

    #preview blockquote p { margin: 0; }

    #preview hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5em 0;
    }

    #preview table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 13px;
    }

    #preview th, #preview td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    #preview th {
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
    }

    #preview td { color: var(--text-muted); }
    #preview tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    /* Inline code */
    #preview :not(pre) > code {
      background: var(--panel);
      color: #f472b6;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.88em;
    }

    /* Code blocks (non-yatt) */
    #preview pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 1em 0;
      font-size: 13px;
      line-height: 1.5;
    }

    #preview pre code {
      background: none;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    /* ─── YATT controls (tabbed per-block) ───────────────────── */

    .yatt-ctrl {
      margin: 20px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
      resize: vertical;
    }

    .yatt-ctrl-bar {
      display: flex;
      gap: 2px;
      padding: 4px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .yatt-ctrl-tab {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text-muted);
      border-radius: 3px;
      font-family: inherit;
      transition: color 0.1s, background 0.1s;
    }

    .yatt-ctrl-tab:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .yatt-ctrl-tab.active {
      color: var(--accent-hi);
      background: rgba(59,130,246,0.12);
    }

    .yatt-ctrl-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .yatt-ctrl-panel { display: none; }

    .yatt-ctrl-panel.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .yatt-ctrl-panel[data-panel="timeline"] svg { max-width: 100%; height: auto; display: block; }

    /* inline error banner inside ctrl */
    .yatt-ctrl-errors {
      background: rgba(239,68,68,0.08);
      border-bottom: 1px solid rgba(239,68,68,0.3);
      padding: 6px 12px;
      font-size: 11px;
      color: var(--red);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      flex-shrink: 0;
    }

    /* standalone error block (load failure) */
    .yatt-errors {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 12px 0;
    }

    .yatt-errors p {
      color: var(--red);
      font-size: 12px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      margin: 0;
      line-height: 1.5;
    }

    .yatt-errors p + p { margin-top: 4px; }

    /* ─── Kanban ──────────────────────────────────────────────── */

    .ctrl-kanban {
      display: flex;
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
      align-items: flex-start;
    }

    .k-col {
      flex: 0 0 200px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 360px;
    }

    .k-col.empty { flex: 0 0 32px; }
    .k-col.empty .k-col-header,
    .k-col.empty .k-cards { display: none; }
    .k-col-empty-label { display: none; }
    .k-col.empty .k-col-empty-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      padding: 10px 0;
    }

    .k-col-empty-line { width: 3px; border-radius: 2px; flex-shrink: 0; min-height: 24px; flex: 1; max-height: 60px; }
    .k-col-empty-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .k-col-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .k-col-line { width: 3px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .k-col-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; flex: 1; }
    .k-col-count { font-size: 11px; color: var(--text-muted); }

    .k-cards {
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .k-cards::-webkit-scrollbar { width: 3px; }
    .k-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .k-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
    }

    .k-card-name { font-size: 11px; color: var(--text); line-height: 1.4; margin-bottom: 3px; }

    .k-card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

    .k-progress { height: 2px; background: var(--border); border-radius: 1px; margin-top: 6px; overflow: hidden; }
    .k-progress-fill { height: 100%; border-radius: 1px; background: var(--accent); }

    .k-priority { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .k-priority[data-p="critical"] { color: var(--red); }
    .k-priority[data-p="high"] { color: var(--accent-hi); }

    /* ─── People ──────────────────────────────────────────────── */

    .ctrl-people { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }

    .person-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }

    .person-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .person-name { font-size: 12px; font-weight: 600; }
    .person-count { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    .ptask-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
    }

    .ptask-row:last-child { border-bottom: none; }
    .ptask-name { font-size: 12px; flex: 1; }
    .ptask-prog { font-size: 10px; color: var(--text-muted); font-family: ui-monospace, monospace; }

    /* ─── Shared atoms ────────────────────────────────────────── */

    .sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--border);
      font-size: 9px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }

    .avatar-lg { width: 32px; height: 32px; font-size: 11px; }

    /* ─── View modes ──────────────────────────────────────────── */

    /* view-editor: hide preview */
    #workspace.view-editor #editor-pane {
      flex: 0 0 100%;
      border-right: none;
    }
    #workspace.view-editor #divider,
    #workspace.view-editor #preview-pane { display: none; }

    /* view-preview: hide editor */
    #workspace.view-preview #preview-pane { flex: 0 0 100%; }
    #workspace.view-preview #editor-pane,
    #workspace.view-preview #divider { display: none; }

    /* ─── Status bar ──────────────────────────────────────────── */

    #statusbar {
      flex: 0 0 var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      gap: 16px;
      user-select: none;
    }

    #status-errors { min-width: 80px; }
    #status-errors.has-errors { color: var(--red); font-weight: 600; }
    #status-chars { color: var(--text-muted); }
    .powered { color: var(--text-muted); opacity: 0.6; }

    /* ─── Responsive ──────────────────────────────────────────── */

    @media (max-width: 767px) {
      #divider { display: none; }
      #editor-pane { display: none; }
      #preview-pane { flex: 0 0 100%; }
      #workspace.view-editor #editor-pane { display: flex; flex: 0 0 100%; }
      #workspace.view-editor #preview-pane { display: none; }
      #workspace.view-preview #preview-pane { display: block; flex: 0 0 100%; }
      #workspace.view-preview #editor-pane { display: none; }
      #preview { padding: 16px; }
    }

    /* ─── Syntax-highlight token classes ─────────────────────── */

    /* Markdown */
    .hl-md-fence    { color: #388bfd; font-weight: 600; }
    .hl-md-codefence { color: #6e7681; }
    .hl-md-h1       { color: #e6edf3; font-weight: 700; }
    .hl-md-h2       { color: #e6edf3; font-weight: 600; }
    .hl-md-h3       { color: #c9d1d9; font-weight: 600; }
    .hl-md-text     { color: #c9d1d9; }

    /* YATT structural */
    .hl-comment     { color: #6e7681; font-style: italic; }
    .hl-meta-key    { color: #79c0ff; }
    .hl-meta-val    { color: #e6edf3; }
    .hl-punct       { color: #8b949e; }
    .hl-section     { color: #e6edf3; font-weight: 700; }
    .hl-ms-marker   { color: #e3b341; font-weight: 700; }
    .hl-ms-name     { color: #ffa657; }
    .hl-parallel-kw { color: #ff7b72; font-weight: 600; }
    .hl-parallel-id { color: #ffa657; }
    .hl-dot         { color: #484f58; }
    .hl-bracket     { color: #8b949e; }
    .hl-pipe        { color: #3d444d; }
    .hl-name        { color: #e6edf3; }
    .hl-default     { color: #c9d1d9; }

    /* YATT status sigils */
    .hl-s-new       { color: #8b949e; }
    .hl-s-active    { color: #388bfd; font-weight: 600; }
    .hl-s-done      { color: #3fb950; font-weight: 600; }
    .hl-s-blocked   { color: #f85149; font-weight: 600; }
    .hl-s-atrisk    { color: #f0883e; font-weight: 600; }
    .hl-s-deferred  { color: #bc8cff; }
    .hl-s-cancelled { color: #6e7681; }
    .hl-s-review    { color: #d29922; font-weight: 600; }
    .hl-s-paused    { color: #8b949e; }

    /* YATT task fields */
    .hl-duration    { color: #bc8cff; }
    .hl-assignee    { color: #79c0ff; }
    .hl-tag         { color: #e3b341; }
    .hl-progress    { color: #f0883e; }
    .hl-id          { color: #56d364; }
    .hl-dep         { color: #56d364; }
    .hl-priority    { color: #ff7b72; }
    .hl-modifier    { color: #ffa657; }
    .hl-date        { color: #7ee787; }
    .hl-extref      { color: #8b949e; font-style: italic; }
    .hl-recur       { color: #d2a8ff; }

    /* ─── Scrollbar for hljs ──────────────────────────────────── */

    .hljs { background: transparent !important; }
  </style>
</head>
<body>

<div id="app">
  <header id="toolbar">
    <div class="logo">YATT<span>Editor</span></div>
    <div class="toolbar-center">
      <select id="examples-select" title="Load an example">
        <option value="quick-start">Quick start</option>
        <option value="software-release">Software release</option>
        <option value="personal-project">Personal project</option>
        <option value="construction">Construction</option>
      </select>
    </div>
    <div class="toolbar-right">
      <div class="view-toggle">
        <button data-view="split" class="active">Split</button>
        <button data-view="editor">Editor</button>
        <button data-view="preview">Preview</button>
      </div>
    </div>
  </header>

  <div id="workspace">
    <div id="editor-pane">
      <div id="editor-wrapper">
        <pre id="editor-highlight" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>
    <div id="divider"></div>
    <div id="preview-pane">
      <div id="preview"></div>
    </div>
  </div>

  <footer id="statusbar">
    <span id="status-errors"></span>
    <span id="status-chars"></span>
    <span class="powered">Powered by YATT</span>
  </footer>
</div>

<!-- External deps -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<script src="./yatt.bundle.js"></script>

<!-- Global helpers (called from inline onclick in yatt ctrl tabs) -->
<script>
function yattCtrlSetView(ctrlId, panel) {
  var ctrl = document.getElementById(ctrlId);
  if (!ctrl) return;
  ctrl.querySelectorAll('.yatt-ctrl-tab').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-panel') === panel);
  });
  ctrl.querySelectorAll('.yatt-ctrl-panel').forEach(function(p) {
    p.classList.toggle('active', p.getAttribute('data-panel') === panel);
  });
}
</script>

<script>
(function () {
  'use strict';

  // ─── Example content ────────────────────────────────────────────────────────

  const EXAMPLES = {
    'quick-start': `# My Project

  // ─── State ───────────────────────────────────────────────────────────────────

  let errorCount = 0;
  let debounceTimer = null;
  let isDragging = false;
  let dragStartX = 0;
  let dragStartWidth = 0;

  // ─── DOM refs ────────────────────────────────────────────────────────────────

  const editor          = document.getElementById('editor');
  const editorHighlight = document.getElementById('editor-highlight');
  const preview         = document.getElementById('preview');
  const workspace     = document.getElementById('workspace');
  const editorPane    = document.getElementById('editor-pane');
  const divider       = document.getElementById('divider');
  const examplesSelect = document.getElementById('examples-select');
  const statusErrors  = document.getElementById('status-errors');
  const statusChars   = document.getElementById('status-chars');
  const viewButtons   = document.querySelectorAll('.view-toggle button');

  // ─── Marked setup ────────────────────────────────────────────────────────────

  function setupMarked() {
    const renderer = new marked.Renderer();

    renderer.code = function (codeOrToken, infoOrLang, escaped) {
      // marked@12 passes a token object as first arg
      let code, lang;
      if (typeof codeOrToken === 'object' && codeOrToken !== null) {
        code = codeOrToken.text;
        lang = (codeOrToken.lang || '').trim().toLowerCase();
      } else {
        code = codeOrToken;
        lang = (infoOrLang || '').trim().toLowerCase();
      }

      if (lang === 'yatt') {
        return renderYattBlock(code);
      }

      // Non-yatt: use highlight.js
      let highlighted;
      try {
        if (lang && window.hljs && window.hljs.getLanguage(lang)) {
          highlighted = window.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
        } else if (window.hljs) {
          highlighted = window.hljs.highlightAuto(code).value;
        } else {
          highlighted = escapeHtml(code);
        }
      } catch (e) {
        highlighted = escapeHtml(code);
      }
      const langClass = lang ? ` class="language-${escapeAttr(lang)}"` : '';
      return `<pre><code${langClass}>${highlighted}</code></pre>`;
    };

    marked.use({
      renderer,
      gfm: true,
      breaks: false,
    });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(str) {
    return str.replace(/"/g, '&quot;');
  }

  // ─── YATT control helpers ────────────────────────────────────────────────────

  let yattCtrlSeq = 0;

  const STATUS_COLOR = {
    'new': '#7d8590', 'active': '#388bfd', 'done': '#3fb950', 'blocked': '#f85149',
    'at-risk': '#f0883e', 'deferred': '#bc8cff', 'cancelled': '#30363d',
    'review': '#d29922', 'paused': '#484f58',
  };

  const STATUS_LABEL = {
    'new': 'New', 'active': 'Active', 'done': 'Done', 'blocked': 'Blocked',
    'at-risk': 'At Risk', 'deferred': 'Deferred', 'cancelled': 'Cancelled',
    'review': 'Review', 'paused': 'Paused',
  };

  const KANBAN_COLS = ['new', 'active', 'review', 'blocked', 'paused', 'done', 'cancelled'];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ─── Syntax highlighting ──────────────────────────────────────────────────────

  function syncHighlight() {
    editorHighlight.innerHTML = buildHighlight(editor.value);
    editorHighlight.scrollTop = editor.scrollTop;
  }

  function statusCls(s) {
    const sigil = { ' ':'hl-s-new','~':'hl-s-active','x':'hl-s-done','!':'hl-s-blocked',
      '?':'hl-s-atrisk','>':'hl-s-deferred','_':'hl-s-cancelled','-':'hl-s-cancelled',
      '=':'hl-s-review','o':'hl-s-paused' };
    const word  = { 'new':'hl-s-new','active':'hl-s-active','done':'hl-s-done','blocked':'hl-s-blocked',
      'at-risk':'hl-s-atrisk','deferred':'hl-s-deferred','cancelled':'hl-s-cancelled',
      'review':'hl-s-review','paused':'hl-s-paused' };
    return sigil[s] || word[s.toLowerCase()] || 'hl-s-new';
  }

  // Split "name | f1 | f2 | after:a|b | f3" keeping after:x|y together
  function splitPipeFields(str) {
    const parts = str.split('|');
    const acc = [];
    for (const p of parts) {
      if (acc.length > 0 && /^\s*after:/i.test(acc[acc.length - 1]) && /^\s*[\w-]+\s*$/.test(p)) {
        acc[acc.length - 1] += '|' + p;
      } else {
        acc.push(p);
      }
    }
    return acc;
  }

  function hlField(raw) {
    const f = raw.trim();
    if (!f) return esc(raw);
    if (/^\d+(?:\.\d+)?(h|bd|d|w|m|q)$/.test(f))
      return '<span class="hl-duration">' + esc(f) + '</span>';
    if (/^(@[\w-]+\s*)+$/.test(f))
      return f.replace(/(@[\w-]+)/g, m => '<span class="hl-assignee">' + esc(m) + '</span>');
    if (/^#[\w-]+$/.test(f))
      return '<span class="hl-tag">' + esc(f) + '</span>';
    if (/^%\d+$/.test(f))
      return '<span class="hl-progress">' + esc(f) + '</span>';
    if (/^id:[\w-]+$/i.test(f))
      return '<span class="hl-punct">id:</span><span class="hl-id">' + esc(f.slice(3)) + '</span>';
    if (/^after:/i.test(f))
      return '<span class="hl-punct">after:</span><span class="hl-dep">' + esc(f.slice(6)) + '</span>';
    if (/^!(high|critical|low|normal)$/i.test(f))
      return '<span class="hl-priority">' + esc(f) + '</span>';
    if (/^\+[\w-]+(:\S+)?$/.test(f))
      return '<span class="hl-modifier">' + esc(f) + '</span>';
    if (/^>\d{4}-\d{2}-\d{2}$/.test(f))
      return '<span class="hl-date">' + esc(f) + '</span>';
    if (/^<\d{4}-\d{2}-\d{2}$/.test(f))
      return '<span class="hl-date">' + esc(f) + '</span>';
    if (/^\$[\w-]+$/.test(f))
      return '<span class="hl-extref">' + esc(f) + '</span>';
    if (/^\*(daily|weekday|weekly|biweekly|monthly|quarterly|yearly)$/i.test(f))
      return '<span class="hl-recur">' + esc(f) + '</span>';
    const shiftM = f.match(/^(delayed|blocked)\s+(\S+)$/i);
    if (shiftM)
      return '<span class="hl-modifier">' + esc(shiftM[1]) + '</span> <span class="hl-duration">' + esc(shiftM[2]) + '</span>';
    return '<span class="hl-default">' + esc(f) + '</span>';
  }

  function hlTaskLine(trimmed) {
    let rest = trimmed;
    let out = '';
    // Leading dots
    const dotM = rest.match(/^(\.{1,3})\s*/);
    if (dotM) {
      out += '<span class="hl-dot">' + esc(dotM[1]) + '</span>';
      rest = rest.slice(dotM[0].length);
    }
    // Status badge [x] or [done]
    const sM = rest.match(/^(\[)([^\]]+)(\])\s*/);
    if (sM) {
      out += '<span class="hl-bracket">[</span>' +
             '<span class="' + statusCls(sM[2]) + '">' + esc(sM[2]) + '</span>' +
             '<span class="hl-bracket">]</span> ';
      rest = rest.slice(sM[0].length);
    }
    const fields = splitPipeFields(rest);
    out += '<span class="hl-name">' + esc(fields[0]) + '</span>';
    for (let i = 1; i < fields.length; i++)
      out += '<span class="hl-pipe"> | </span>' + hlField(fields[i]);
    return out;
  }

  function hlMilestoneLine(trimmed) {
    const fields = splitPipeFields(trimmed.slice(2));
    let out = '<span class="hl-ms-marker">>></span><span class="hl-ms-name">' + esc(fields[0]) + '</span>';
    for (let i = 1; i < fields.length; i++)
      out += '<span class="hl-pipe"> | </span>' + hlField(fields[i]);
    return out;
  }

  function hlParallelLine(trimmed) {
    const m = trimmed.match(/^(parallel|end)\s*:\s*(.*)/i);
    if (!m) return '<span class="hl-default">' + esc(trimmed) + '</span>';
    const fields = splitPipeFields(m[2]);
    let out = '<span class="hl-parallel-kw">' + esc(m[1]) + ':</span>';
    if (fields[0].trim()) out += ' <span class="hl-parallel-id">' + esc(fields[0]) + '</span>';
    for (let i = 1; i < fields.length; i++)
      out += '<span class="hl-pipe"> | </span>' + hlField(fields[i]);
    return out;
  }

  const YATT_META = /^(title|start|finish|schedule|owner|version|timezone|week-start)\s*:/i;

  function hlYattLine(line) {
    const indent = line.match(/^(\s*)/)[1];
    const trimmed = line.slice(indent.length);
    const ei = esc(indent);
    if (!trimmed) return '';

    if (trimmed.startsWith('//'))
      return ei + '<span class="hl-comment">' + esc(trimmed) + '</span>';

    if (YATT_META.test(trimmed)) {
      const m = trimmed.match(/^([\w-]+)\s*:\s*(.*)/);
      if (m) return ei +
        '<span class="hl-meta-key">' + esc(m[1]) + '</span>' +
        '<span class="hl-punct">: </span>' +
        '<span class="hl-meta-val">' + esc(m[2]) + '</span>';
    }

    if (trimmed.startsWith('>>'))
      return ei + hlMilestoneLine(trimmed);

    if (/^(parallel|end)\s*:/i.test(trimmed))
      return ei + hlParallelLine(trimmed);

    if (/^#{1,3}\s/.test(trimmed))
      return ei + '<span class="hl-section">' + esc(trimmed) + '</span>';

    if (/^\*(daily|weekday|weekly|biweekly|monthly|quarterly|yearly)\s+/i.test(trimmed)) {
      const m = trimmed.match(/^(\*\w+)\s+(.*)/);
      if (m) {
        const fields = splitPipeFields(m[2]);
        let out = ei + '<span class="hl-recur">' + esc(m[1]) + '</span> <span class="hl-name">' + esc(fields[0]) + '</span>';
        for (let i = 1; i < fields.length; i++) out += '<span class="hl-pipe"> | </span>' + hlField(fields[i]);
        return out;
      }
    }

    if (/^\.{0,3}\s*\[/.test(trimmed))
      return ei + hlTaskLine(trimmed);

    return '<span class="hl-default">' + esc(line) + '</span>';
  }

  function hlMarkdownLine(line) {
    const hm = line.match(/^(#{1,4})\s/);
    if (hm) {
      const cls = hm[1].length === 1 ? 'hl-md-h1' : hm[1].length === 2 ? 'hl-md-h2' : 'hl-md-h3';
      return '<span class="' + cls + '">' + esc(line) + '</span>';
    }
    return '<span class="hl-md-text">' + esc(line) + '</span>';
  }

  function buildHighlight(text) {
    const lines = text.split('\n');
    let mode = 'md'; // 'md' | 'yatt' | 'fence'
    let fenceClose = '```';
    const out = [];
    for (const line of lines) {
      if (mode === 'md') {
        if (/^```yatt\s*$/.test(line))  { mode = 'yatt'; fenceClose = '```'; out.push('<span class="hl-md-fence">```yatt</span>'); continue; }
        if (/^~~~yatt\s*$/.test(line))  { mode = 'yatt'; fenceClose = '~~~'; out.push('<span class="hl-md-fence">~~~yatt</span>'); continue; }
        if (/^```/.test(line))          { mode = 'fence'; fenceClose = '```'; out.push('<span class="hl-md-codefence">' + esc(line) + '</span>'); continue; }
        if (/^~~~/.test(line))          { mode = 'fence'; fenceClose = '~~~'; out.push('<span class="hl-md-codefence">' + esc(line) + '</span>'); continue; }
        out.push(hlMarkdownLine(line));
      } else if (mode === 'yatt') {
        if (line.trimEnd() === fenceClose) { mode = 'md'; out.push('<span class="hl-md-fence">' + esc(line) + '</span>'); continue; }
        out.push(hlYattLine(line));
      } else {
        if (line.trimEnd() === fenceClose) { mode = 'md'; out.push('<span class="hl-md-codefence">' + esc(line) + '</span>'); continue; }
        out.push('<span class="hl-md-codefence">' + esc(line) + '</span>');
      }
    }
    return out.join('\n') + '\n'; // trailing \n keeps cursor visible at end
  }

  function sdotHtml(status) {
    const c = STATUS_COLOR[status] || '#7d8590';
    return `<span class="sdot" style="background:${c}" title="${esc(status)}"></span>`;
  }

  function avatarHtml(name, large) {
    const clean = name.replace(/[^a-zA-Z]/g, '');
    const init = (clean.slice(0, 2) || name.slice(0, 2)).toUpperCase();
    return `<span class="${large ? 'avatar avatar-lg' : 'avatar'}" title="@${esc(name)}">${esc(init)}</span>`;
  }

  function extractTasks(items, depth) {
    const tasks = [];
    depth = depth || 0;
    for (const item of (items || [])) {
      if (item.type === 'task') {
        const t = item;
        const info = {
          name: t.name,
          status: t.status,
          assignees: t.assignees || [],
          tags: t.tags || [],
          priority: t.priority,
          progress: t.progress,
          modifiers: t.modifiers || [],
          depth,
          line: t.line,
        };
        tasks.push(info);
        if (t.subtasks && t.subtasks.length) {
          tasks.push(...extractTasks(t.subtasks, depth + 1));
        }
      } else if (item.type === 'parallel') {
        tasks.push(...extractTasks(item.items, depth));
      }
    }
    return tasks;
  }

  function buildKanbanHtml(tasks) {
    const byStatus = {};
    KANBAN_COLS.forEach(s => { byStatus[s] = []; });
    for (const t of (tasks || [])) {
      const s = t.status || 'new';
      if (!byStatus[s]) byStatus[s] = [];
      byStatus[s].push(t);
    }
    let html = '';
    for (const status of KANBAN_COLS) {
      const cards = byStatus[status] || [];
      const color = STATUS_COLOR[status] || '#7d8590';
      const label = STATUS_LABEL[status] || status;
      const isEmpty = cards.length === 0;
      html += `<div class="k-col${isEmpty ? ' empty' : ''}" data-status="${esc(status)}">`;
      if (isEmpty) {
        html += `<div class="k-col-empty-label">` +
          `<span class="k-col-empty-line" style="background:${color}"></span>` +
          `<span class="k-col-empty-title" style="color:${color}">${esc(label)}</span>` +
          `</div>`;
      } else {
        html += `<div class="k-col-header">` +
          `<span class="k-col-line" style="background:${color}"></span>` +
          `<span class="k-col-title">${esc(label)}</span>` +
          `<span class="k-col-count">${cards.length}</span>` +
          `</div>`;
      }
      html += `<div class="k-cards">`;
      for (const t of cards) {
        const indent = t.depth > 0 ? `padding-left:${8 + t.depth * 10}px;` : '';
        html += `<div class="k-card" style="${indent}">`;
        html += `<div class="k-card-name">${esc(t.name)}</div>`;
        html += `<div class="k-card-meta">`;
        if (t.assignees && t.assignees.length) {
          t.assignees.slice(0, 3).forEach(a => { html += avatarHtml(a, false); });
        }
        if (t.priority && t.priority !== 'normal') {
          html += `<span class="k-priority" data-p="${esc(t.priority)}">${esc(t.priority)}</span>`;
        }
        html += `</div>`;
        if (t.progress != null) {
          html += `<div class="k-progress"><div class="k-progress-fill" style="width:${t.progress}%"></div></div>`;
        }
        html += `</div>`;
      }
      html += `</div></div>`;
    }
    return html || '<div style="padding:20px;color:var(--text-muted);font-size:13px;">No tasks.</div>';
  }

  function buildPeopleHtml(tasks) {
    const byPerson = {};
    for (const t of (tasks || [])) {
      const people = t.assignees && t.assignees.length ? t.assignees : ['(unassigned)'];
      for (const p of people) {
        if (!byPerson[p]) byPerson[p] = [];
        byPerson[p].push(t);
      }
    }
    const names = Object.keys(byPerson).sort((a, b) => {
      if (a === '(unassigned)') return 1;
      if (b === '(unassigned)') return -1;
      return a.localeCompare(b);
    });
    if (!names.length) return '<div style="padding:20px;color:var(--text-muted);font-size:13px;">No tasks.</div>';
    let html = '';
    for (const name of names) {
      const list = byPerson[name];
      const isU = name === '(unassigned)';
      html += `<div class="person-card"><div class="person-header">`;
      if (!isU) html += avatarHtml(name, true);
      html += `<div><div class="person-name">${esc(isU ? 'Unassigned' : '@' + name)}</div>`;
      html += `<div class="person-count">${list.length} task${list.length === 1 ? '' : 's'}</div></div></div>`;
      for (const t of list) {
        html += `<div class="ptask-row">${sdotHtml(t.status)}`;
        html += `<span class="ptask-name">${esc(t.name)}</span>`;
        if (t.priority && t.priority !== 'normal') {
          html += `<span style="font-size:10px;color:var(--text-muted)">${esc(t.priority)}</span>`;
        }
        if (t.progress != null) {
          html += `<span class="ptask-prog">${t.progress}%</span>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    return html;
  }

  // ─── YATT rendering ──────────────────────────────────────────────────────────

  function renderYattBlock(code) {
    const yatt = window.YattLib;

    if (!yatt || typeof yatt.render !== 'function') {
      errorCount++;
      return `<div class="yatt-errors"><p>YattLib not loaded — make sure yatt.bundle.js is present.</p></div>`;
    }

    const ctrlId = `yatt-ctrl-${++yattCtrlSeq}`;

    try {
      // Render gantt SVG
      const result = yatt.render(code, 'gantt');

      let ganttHtml = '';
      let errors = [];

      if (typeof result === 'string') {
        if (result.trim().startsWith('<svg') || result.trim().startsWith('<?xml')) {
          ganttHtml = result;
        } else {
          errors.push(result);
        }
      } else if (result && typeof result === 'object') {
        errors = result.errors ? [].concat(result.errors) : [];
        const svg = result.html || result.svg || result.output || '';
        if (svg.trim().startsWith('<svg') || svg.trim().startsWith('<?xml')) {
          ganttHtml = svg;
        }
      }

      errorCount += errors.length;

      // Extract tasks for kanban / people panels
      let tasks = [];
      try {
        if (yatt.parse && yatt.schedule) {
          const { doc } = yatt.parse(code);
          tasks = extractTasks(doc.items);
        }
      } catch (e) { /* non-fatal */ }

      const errBanner = errors.length
        ? `<div class="yatt-ctrl-errors">${errors.map(e => esc(typeof e === 'string' ? e : (e.message || String(e)))).join('<br>')}</div>`
        : '';

      const timelinePanel = ganttHtml
        ? `<div class="yatt-ctrl-panel active" data-panel="timeline">${ganttHtml}</div>`
        : `<div class="yatt-ctrl-panel active" data-panel="timeline"><div style="padding:20px;color:var(--text-muted);font-size:13px;">(no output)</div></div>`;

      const kanbanPanel = `<div class="yatt-ctrl-panel" data-panel="kanban"><div class="ctrl-kanban">${buildKanbanHtml(tasks)}</div></div>`;
      const peoplePanel = `<div class="yatt-ctrl-panel" data-panel="people"><div class="ctrl-people">${buildPeopleHtml(tasks)}</div></div>`;

      const tabs = ['timeline', 'kanban', 'people'].map((p, i) =>
        `<button class="yatt-ctrl-tab${i === 0 ? ' active' : ''}" data-panel="${p}" onclick="yattCtrlSetView('${ctrlId}','${p}')">${p.charAt(0).toUpperCase() + p.slice(1)}</button>`
      ).join('');

      return `<div class="yatt-ctrl" id="${ctrlId}">${errBanner}<div class="yatt-ctrl-bar">${tabs}</div><div class="yatt-ctrl-body">${timelinePanel}${kanbanPanel}${peoplePanel}</div></div>`;

    } catch (err) {
      errorCount++;
      const msg = err && err.message ? err.message : String(err);
      return `<div class="yatt-errors"><p>${escapeHtml(msg)}</p></div>`;
    }
  }

  // ─── Render preview ──────────────────────────────────────────────────────────

  function renderPreview() {
    errorCount = 0;
    yattCtrlSeq = 0;

    const content = editor.value;
    let html = '';

    try {
      html = marked.parse(content);
    } catch (err) {
      html = `<div class="yatt-errors"><p>Markdown parse error: ${escapeHtml(err.message)}</p></div>`;
    }

    preview.innerHTML = html;

    // Update status bar
    updateStatusBar(content.length);
  }

  function updateStatusBar(charCount) {
    if (errorCount === 0) {
      statusErrors.textContent = 'No errors';
      statusErrors.classList.remove('has-errors');
    } else {
      statusErrors.textContent = `${errorCount} error${errorCount === 1 ? '' : 's'}`;
      statusErrors.classList.add('has-errors');
    }
    statusChars.textContent = `${charCount.toLocaleString()} chars`;
  }

  // ─── Debounced render ────────────────────────────────────────────────────────

  function scheduleRender() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, 200);
  }

  // ─── Tab key ─────────────────────────────────────────────────────────────────

  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      syncHighlight();
      scheduleRender();
    }
  });

  editor.addEventListener('input', function () {
    syncHighlight();
    scheduleRender();
  });

  editor.addEventListener('scroll', function () {
    editorHighlight.scrollTop = this.scrollTop;
  });

  // ─── Examples dropdown ───────────────────────────────────────────────────────

  examplesSelect.addEventListener('change', function () {
    const key = this.value;
    if (EXAMPLES[key] !== undefined) {
      editor.value = EXAMPLES[key];
      syncHighlight();
      renderPreview();
    }
  });

  // ─── View toggle ─────────────────────────────────────────────────────────────

  viewButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const view = this.dataset.view;
      viewButtons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      workspace.classList.remove('view-editor', 'view-preview');
      if (view === 'editor') {
        workspace.classList.add('view-editor');
      } else if (view === 'preview') {
        workspace.classList.add('view-preview');
      }
      // 'split' = no extra class
    });
  });

  // ─── Draggable divider ───────────────────────────────────────────────────────

  divider.addEventListener('mousedown', function (e) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartWidth = editorPane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    const workspaceWidth = workspace.getBoundingClientRect().width;
    const delta = e.clientX - dragStartX;
    let newWidth = dragStartWidth + delta;

    // Clamp: min 20%, max 80%
    const minW = workspaceWidth * 0.2;
    const maxW = workspaceWidth * 0.8;
    newWidth = Math.max(minW, Math.min(maxW, newWidth));

    const pct = (newWidth / workspaceWidth * 100).toFixed(2);
    editorPane.style.flex = `0 0 ${pct}%`;
  });

  document.addEventListener('mouseup', function () {
    if (isDragging) {
      isDragging = false;
      divider.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });

  // ─── Responsive: default to preview-only on narrow screens ──────────────────

  function applyResponsiveDefault() {
    if (window.innerWidth < 768) {
      // On mobile, activate preview button by default
      const previewBtn = document.querySelector('.view-toggle button[data-view="preview"]');
      if (previewBtn && !workspace.classList.contains('view-editor') && !workspace.classList.contains('view-preview')) {
        previewBtn.click();
      }
    }
  }

  // ─── Init ────────────────────────────────────────────────────────────────────

  function init() {
    setupMarked();
    editor.value = EXAMPLES['quick-start'];
    syncHighlight();
    renderPreview();
    applyResponsiveDefault();
  }

  // Wait for all scripts to load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
